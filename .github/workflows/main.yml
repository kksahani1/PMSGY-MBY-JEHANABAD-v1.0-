name: Build PMSGY MBY Jehanabad (1) APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Zip या 'pmsgy-mby-jehanabad (1)' नाम के फ़ोल्डर से फ़ाइलों को एक्सट्रैक्ट और अलाइन करें
      - name: Extract and Align Project Files
        run: |
          if [ -f "pmsgy-mby-jehanabad (1).zip" ]; then
            echo "Extracting pmsgy-mby-jehanabad (1).zip..."
            unzip -o "pmsgy-mby-jehanabad (1).zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "pmsgy-mby-jehanabad (1)*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting archive: $ZIP_FILE..."
              unzip -o "$ZIP_FILE"
            fi
          fi
          
          # अगर 'pmsgy-mby-jehanabad (1)' फ़ोल्डर के अंदर मुख्य फ़ाइलें (app, gradle आदि) हैं, तो उन्हें रूट पर लाएगा
          if [ -d "pmsgy-mby-jehanabad (1)" ]; then
            echo "Moving files from 'pmsgy-mby-jehanabad (1)' to root directory..."
            cp -r "pmsgy-mby-jehanabad (1)"/* .
          fi

      # 2. JDK 17 एनवायरनमेंट सेट करें
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. डमी debug.keystore फ़ाइल बनाएँ (Signing error रोकने के लिए)
      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 4. डमी .env फ़ाइल बनाएँ
      - name: Create Environment File
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
            echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" >> .env
          fi

      # 5. Gradle से Debug APK बनाएँ
      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      # 6. जनरेटेड APK को डाउनलोड योग्य Artifact के रूप में अपलोड करें
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMSGY-MBY-Jehanabad-1-Debug-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
